<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>呼び出しの受け取り</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #6b6b6b;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    main {
      max-width: 420px;
      margin: 48px auto;
      padding: 28px 22px;
      background: #fff;
      border-radius: 16px;
      text-align: center;
    }
    #ticket {
      margin: 0 0 12px;
      font-size: 18px;
    }
    #msg {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
    }
    #add-friend {
      display: none;
      margin: 22px auto 0;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: #06c755;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p id="ticket"></p>
    <p id="msg">開いています</p>
    <button id="add-friend" type="button">友達になる</button>
  </main>
  <script>
    var LIFF_ID = '2011957766-n1580yZz';
    var GAS = 'https://script.google.com/macros/s/AKfycbw2iA8TavrF24Z6d_DGqbsyEhVh0BDFsbbQ8AEzqKcGWF1z6s7mvB3Qr37XDvUgfl7D/exec';
    var ADD_URL = 'https://line.me/R/ti/p/@799kcvry';
    var RETRY = '登録できませんでした。番号の画面からもう一度送ってください。';
    var ASK = 'NIGHT PICNIC を友達にしてください。友達にすると、呼び出しが届きます。';
    var SKIPPED = '友達にならないと、呼び出しは届きません。';

    function show(text) {
      document.getElementById('msg').textContent = text;
    }

    function query() {
      var params = new URLSearchParams(location.search);
      var state = params.get('liff.state');
      if (state) {
        var inner = new URLSearchParams(state.charAt(0) === '?' ? state.slice(1) : state);
        inner.forEach(function(value, key) {
          if (!params.get(key)) params.set(key, value);
        });
      }
      return params;
    }

    function infoFromPage() {
      var params = query();
      return {
        storeId: params.get('storeId') || '',
        ticketNumber: params.get('ticketNumber') || ''
      };
    }

    function jsonp(queryText, done) {
      var callbackName = 'npCb' + String(Date.now());
      var script = document.createElement('script');
      window[callbackName] = function(data) {
        try { delete window[callbackName]; } catch (err) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
        done(data || {});
      };
      script.src = GAS + '?' + queryText + '&callback=' + callbackName;
      script.onerror = function() { done({ ok: false, text: RETRY }); };
      document.body.appendChild(script);
    }

    function bind(info) {
      var idToken = liff.getIDToken();
      if (!idToken) {
        show(RETRY);
        return;
      }
      document.getElementById('ticket').textContent = '番号 ' + info.ticketNumber;
      show('番号を受け取っています');
      jsonp(
        'page=linebind&storeId=' + encodeURIComponent(info.storeId)
          + '&ticketNumber=' + encodeURIComponent(info.ticketNumber)
          + '&idToken=' + encodeURIComponent(idToken),
        function(data) {
          if (data.ok) {
            document.getElementById('add-friend').style.display = 'none';
            show('受け取りました');
            return;
          }
          show(data.text || RETRY);
        }
      );
    }

    function openAddPage() {
      if (liff.openWindow) {
        liff.openWindow({ url: ADD_URL, external: false });
        return;
      }
      location.href = ADD_URL;
    }

    function askThenBind(info) {
      var button = document.getElementById('add-friend');
      function afterFriendScreen() {
        liff.getFriendship().then(function(friend) {
          if (friend && friend.friendFlag) {
            button.style.display = 'none';
            bind(info);
            return;
          }
          show(SKIPPED);
          button.style.display = '';
          button.textContent = '友達になる';
        }).catch(function() {
          show(SKIPPED);
          button.style.display = '';
          button.textContent = '友達になる';
        });
      }
      function openFriendScreen() {
        show(ASK);
        button.style.display = '';
        if (!liff.requestFriendship) {
          openAddPage();
          return;
        }
        liff.requestFriendship().then(afterFriendScreen).catch(function() {
          openAddPage();
          show(SKIPPED);
          button.style.display = '';
          button.textContent = '友達にしたので受け取る';
          button.onclick = afterFriendScreen;
        });
      }
      button.onclick = openFriendScreen;
      if (!liff.getFriendship) {
        openFriendScreen();
        return;
      }
      liff.getFriendship().then(function(friend) {
        if (friend && friend.friendFlag) {
          bind(info);
          return;
        }
        openFriendScreen();
      }).catch(openFriendScreen);
    }

    liff.init({ liffId: LIFF_ID }).then(function() {
      if (!liff.isInClient()) {
        show('LINEの外のブラウザで開いています。LINEの中から開くと、貼らずにここまで来ます。');
        return;
      }
      var info = infoFromPage();
      if (!info.storeId || !info.ticketNumber) {
        show('LINEの中で開きました。番号の文は貼っていません。');
        return;
      }
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      document.getElementById('ticket').textContent = '番号 ' + info.ticketNumber;
      askThenBind(info);
    }).catch(function() {
      show('LINEの中では開けませんでした。');
    });
  </script>
</body>
</html>
