<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINEの中で開く</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #6b6b6b;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    main {
      max-width: 420px;
      margin: 48px auto;
      padding: 28px 22px;
      background: #fff;
      border-radius: 16px;
      text-align: center;
    }
    #msg {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <p id="msg">開いています</p>
  </main>
  <script>
    var LIFF_ID = '2009158334-ikKlbc7G';

    function show(text) {
      document.getElementById('msg').textContent = text;
    }

    liff.init({ liffId: LIFF_ID }).then(function() {
      if (liff.isInClient()) {
        show('LINEの中で開きました。番号の文は貼っていません。');
        return;
      }
      show('LINEの外のブラウザで開いています。LINEの中から開くと、貼らずにここまで来ます。');
    }).catch(function() {
      show('LINEの中では開けませんでした。');
    });
  </script>
</body>
</html>
