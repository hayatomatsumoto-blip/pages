<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINEの中で開く</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #6b6b6b;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    main {
      max-width: 420px;
      margin: 48px auto;
      padding: 28px 22px;
      background: #fff;
      border-radius: 16px;
      text-align: center;
    }
    #ticket {
      margin: 0 0 12px;
      font-size: 18px;
    }
    #msg {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <p id="ticket"></p>
    <p id="msg">開いています</p>
  </main>
  <script>
    var LIFF_ID = '2009158334-ikKlbc7G';
    var GAS = 'https://script.google.com/macros/s/AKfycbw2iA8TavrF24Z6d_DGqbsyEhVh0BDFsbbQ8AEzqKcGWF1z6s7mvB3Qr37XDvUgfl7D/exec';
    var RETRY = '登録できませんでした。番号の画面からもう一度送ってください。';

    function show(text) {
      document.getElementById('msg').textContent = text;
    }

    function query() {
      var params = new URLSearchParams(location.search);
      var state = params.get('liff.state');
      if (state) {
        var inner = new URLSearchParams(state.charAt(0) === '?' ? state.slice(1) : state);
        inner.forEach(function(value, key) {
          if (!params.get(key)) params.set(key, value);
        });
      }
      return params;
    }

    function infoFromPage() {
      var params = query();
      return {
        storeId: params.get('storeId') || '',
        ticketNumber: params.get('ticketNumber') || ''
      };
    }

    function jsonp(queryText, done) {
      var callbackName = 'npCb' + String(Date.now());
      var script = document.createElement('script');
      window[callbackName] = function(data) {
        try { delete window[callbackName]; } catch (err) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
        done(data || {});
      };
      script.src = GAS + '?' + queryText + '&callback=' + callbackName;
      script.onerror = function() { done({ ok: false, text: RETRY }); };
      document.body.appendChild(script);
    }

    function bind(info) {
      var idToken = liff.getIDToken();
      if (!idToken) {
        show(RETRY);
        return;
      }
      document.getElementById('ticket').textContent = '番号 ' + info.ticketNumber;
      show('番号を受け取っています');
      jsonp(
        'page=linebind&storeId=' + encodeURIComponent(info.storeId)
          + '&ticketNumber=' + encodeURIComponent(info.ticketNumber)
          + '&idToken=' + encodeURIComponent(idToken),
        function(data) {
          if (data.ok) {
            show('受け取りました');
            return;
          }
          show(data.text || RETRY);
        }
      );
    }

    liff.init({ liffId: LIFF_ID }).then(function() {
      if (!liff.isInClient()) {
        show('LINEの外のブラウザで開いています。LINEの中から開くと、貼らずにここまで来ます。');
        return;
      }
      var info = infoFromPage();
      if (!info.storeId || !info.ticketNumber) {
        show('LINEの中で開きました。番号の文は貼っていません。');
        return;
      }
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      bind(info);
    }).catch(function() {
      show('LINEの中では開けませんでした。');
    });
  </script>
</body>
</html>
